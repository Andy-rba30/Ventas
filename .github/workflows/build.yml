name: Release Windows

# Al crear un tag vX.Y.Z se construye el ejecutable en Windows y se adjunta el zip al Release.
#   git tag v4.2.0 && git push origin v4.2.0
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: PyInstaller (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt pyinstaller

      - name: La versión del paquete debe coincidir con el tag
        shell: bash
        run: |
          VERSION=$(python -c "import agro; print(agro.__version__)")
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "agro.__version__ es $VERSION pero el tag es $GITHUB_REF_NAME"; exit 1
          fi

      - name: Pruebas de datos y servicios
        run: pytest

      - name: Construir ejecutable
        run: pyinstaller agro.spec --noconfirm

      - name: Arranque de humo del ejecutable
        shell: pwsh
        run: |
          $env:AGRO_DATOS = Join-Path $env:RUNNER_TEMP "agro-datos"
          $p = Start-Process -FilePath "dist\AgroNegocio\AgroNegocio.exe" -PassThru
          Start-Sleep -Seconds 12
          if ($p.HasExited) { Write-Error "El ejecutable terminó solo (código $($p.ExitCode))"; exit 1 }
          Stop-Process -Id $p.Id -Force
          if (-not (Test-Path (Join-Path $env:AGRO_DATOS "negocio_final_stock.db"))) {
            Write-Error "El ejecutable no creó la base de datos en AGRO_DATOS"; exit 1
          }
          Get-Content (Join-Path $env:AGRO_DATOS "app.log")

      - name: Empaquetar zip
        shell: pwsh
        run: Compress-Archive -Path dist\AgroNegocio\* -DestinationPath "AgroNegocio-$env:GITHUB_REF_NAME-windows.zip"

      - name: Publicar en el Release
        uses: softprops/action-gh-release@v2
        with:
          name: Agro-Negocio ${{ github.ref_name }}
          files: AgroNegocio-*.zip
          generate_release_notes: true
          body: |
            Ejecutable para Windows (64 bits). Descomprime el zip en cualquier carpeta y abre `AgroNegocio.exe`.
            Los datos se guardan en `%APPDATA%\AgroNegocio` (la ruta exacta se ve en Ajustes).
            Detalle de cambios en [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/CHANGELOG.md).
